<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul" xmlns:html="http://www.w3.org/1999/xhtml">
  <html:h2>Ollama Local AI</html:h2>
  <html:p>使用本机 Ollama 或官方 ChatGPT 订阅授权，为文献生成标签、简记和概览。预览编辑并点击保存后写入文献库。</html:p>
  <html:p>本地引擎先启动 Ollama；订阅引擎请在下方设置中选择 ChatGPT，再通过官方页面登录授权。</html:p>
  <button id="ollama-local-ai-open-settings" label="打开模型与生成设置…"/>
  <html:p>也可从「工具 → Ollama 本地 AI」或选中文献的右键菜单打开。</html:p>
</vbox>
